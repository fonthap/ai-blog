<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <rect width="800" height="260" rx="16" fill="#0f172a"/>
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="20" font-weight="700">How CodeRabbit Works</text>
  <!-- Step 1: Push code -->
  <rect x="30" y="65" width="155" height="80" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="107" y="95" text-anchor="middle" fill="#6366f1" font-family="system-ui" font-size="24">👨‍💻</text>
  <text x="107" y="118" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">You open a PR</text>
  <text x="107" y="135" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Push your changes</text>
  <!-- Arrow -->
  <line x1="195" y1="105" x2="225" y2="105" stroke="#475569" stroke-width="2"/>
  <polygon points="225,100 235,105 225,110" fill="#475569"/>
  <!-- Step 2: CodeRabbit reviews -->
  <rect x="240" y="65" width="155" height="80" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="317" y="95" text-anchor="middle" fill="#f97316" font-family="system-ui" font-size="24">🐇</text>
  <text x="317" y="118" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">CodeRabbit reviews</text>
  <text x="317" y="135" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">~2 min, automatic</text>
  <!-- Arrow -->
  <line x1="405" y1="105" x2="435" y2="105" stroke="#475569" stroke-width="2"/>
  <polygon points="435,100 445,105 435,110" fill="#475569"/>
  <!-- Step 3: Comments -->
  <rect x="450" y="65" width="155" height="80" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="527" y="95" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="24">💬</text>
  <text x="527" y="118" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">You get feedback</text>
  <text x="527" y="135" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Inline comments + summary</text>
  <!-- Arrow -->
  <line x1="615" y1="105" x2="645" y2="105" stroke="#475569" stroke-width="2"/>
  <polygon points="645,100 655,105 645,110" fill="#475569"/>
  <!-- Step 4: Merge -->
  <rect x="660" y="65" width="110" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="715" y="95" text-anchor="middle" fill="#a855f7" font-family="system-ui" font-size="24">✅</text>
  <text x="715" y="118" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="600">Merge</text>
  <text x="715" y="135" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Ship with confidence</text>
  <!-- What it catches -->
  <text x="400" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">What CodeRabbit catches:</text>
  <rect x="50" y="200" width="130" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="115" y="222" text-anchor="middle" fill="#f87171" font-family="system-ui" font-size="11">🐛 Bugs</text>
  <rect x="200" y="200" width="130" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="265" y="222" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="11">🔒 Security issues</text>
  <rect x="350" y="200" width="130" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="415" y="222" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="11">📝 Best practices</text>
  <rect x="500" y="200" width="130" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="565" y="222" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="11">📋 Formatting</text>
  <rect x="650" y="200" width="120" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="710" y="222" text-anchor="middle" fill="#c084fc" font-family="system-ui" font-size="11">♿ Accessibility</text>
</svg>
