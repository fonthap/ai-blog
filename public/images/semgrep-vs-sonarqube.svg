<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <rect width="800" height="340" rx="16" fill="#0f172a"/>
  <text x="400" y="38" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="20" font-weight="700">Semgrep vs SonarQube Community</text>
  <!-- Semgrep side -->
  <rect x="30" y="60" width="360" height="260" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="210" y="90" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="18" font-weight="700">Semgrep</text>
  <text x="210" y="110" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Lightweight &amp; Fast</text>
  <text x="50" y="140" fill="#94a3b8" font-family="system-ui" font-size="12">✅ No server needed (CLI tool)</text>
  <text x="50" y="162" fill="#94a3b8" font-family="system-ui" font-size="12">✅ 30+ languages</text>
  <text x="50" y="184" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Write rules that look like code</text>
  <text x="50" y="206" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Fast: seconds, not minutes</text>
  <text x="50" y="228" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Free for single-file analysis</text>
  <text x="50" y="250" fill="#94a3b8" font-family="system-ui" font-size="12">⚠️ Cross-file analysis = paid</text>
  <text x="50" y="272" fill="#94a3b8" font-family="system-ui" font-size="12">⚠️ No UI dashboard (CLI only)</text>
  <text x="210" y="305" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="600">Best for: CI/CD pipelines, devs</text>
  <!-- SonarQube side -->
  <rect x="410" y="60" width="360" height="260" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="90" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="18" font-weight="700">SonarQube Community</text>
  <text x="590" y="110" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Full Dashboard &amp; History</text>
  <text x="430" y="140" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Web dashboard with metrics</text>
  <text x="430" y="162" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Quality Gates (pass/fail)</text>
  <text x="430" y="184" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Historical trend tracking</text>
  <text x="430" y="206" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Code smells + duplication</text>
  <text x="430" y="228" fill="#94a3b8" font-family="system-ui" font-size="12">✅ Free &amp; self-hosted</text>
  <text x="430" y="250" fill="#94a3b8" font-family="system-ui" font-size="12">⚠️ Needs a server (Java + DB)</text>
  <text x="430" y="272" fill="#94a3b8" font-family="system-ui" font-size="12">⚠️ Slower scans</text>
  <text x="590" y="305" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="13" font-weight="600">Best for: teams, management</text>
</svg>
